<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba8252"/>
      <stop offset="100%" stop-color="#694121"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Établi d'artisan en bois massif -->
    <!-- Plateau de l'établi -->
    <rect x="12" y="32" width="40" height="6" rx="1" fill="url(#wood)" stroke="#523214" stroke-width="1"/>
    <!-- Pieds massifs de l'établi avec entretoise -->
    <rect x="16" y="38" width="4" height="12" fill="#523214"/>
    <rect x="44" y="38" width="4" height="12" fill="#523214"/>
    <line x1="18" y1="45" x2="46" y2="45" stroke="#523214" stroke-width="2"/>
    <!-- Rabot à bois posé sur l'établi -->
    <rect x="22" y="26" width="16" height="6" rx="1" fill="url(#gold)" stroke="#8f6418" stroke-width="0.8"/>
    <!-- Lame inclinée du rabot et poignées -->
    <line x1="28" y1="24" x2="33" y2="30" stroke="url(#steel)" stroke-width="1.8"/>
    <path d="M 23 26 C 22 23, 24 22, 25 24" fill="none" stroke="#523214" stroke-width="1.5"/>
    <path d="M 37 26 C 38 23, 36 22, 35 24" fill="none" stroke="#523214" stroke-width="1.5"/>
    <!-- Copeau de bois en spirale -->
    <path d="M 27 24 C 25 20, 30 18, 30 22" fill="none" stroke="#f5d77f" stroke-width="1.2"/>
    <!-- Étau à vis à gauche de l'établi -->
    <rect x="10" y="30" width="3" height="8" fill="url(#steel)"/>
    <circle cx="9" cy="34" r="1.5" fill="url(#steel)"/>
    <!-- Scie égoïne suspendue en arrière-plan -->
    <g transform="translate(38, 14)">
      <polygon points="0,0 12,12 8,12 0,4" fill="url(#steel)" stroke="#525d6e" stroke-width="0.7"/>
      <circle cx="1" cy="2" r="2" fill="url(#wood)"/>
    </g>
    <!-- Sol de l'atelier avec copeaux -->
    <line x1="10" y1="50" x2="54" y2="50" stroke="#7a8290" stroke-width="1.5"/>
    <circle cx="28" cy="49" r="1" fill="#f5d77f"/>
    <circle cx="38" cy="49" r="0.8" fill="#f5d77f"/>
  </g>
</svg>