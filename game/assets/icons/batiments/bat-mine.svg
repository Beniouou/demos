<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <linearGradient id="coal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d535e"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Chevalement de mine (Tour d'extraction) -->
    <!-- Roue d'extraction / molette au sommet -->
    <circle cx="32" cy="18" r="6" fill="#1b2029" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="32" cy="18" r="1.8" fill="url(#gold)"/>
    <line x1="32" y1="12" x2="32" y2="24" stroke="url(#gold)" stroke-width="0.8"/>
    <line x1="26" y1="18" x2="38" y2="18" stroke="url(#gold)" stroke-width="0.8"/>
    <!-- Poutres treillis du chevalement -->
    <line x1="32" y1="18" x2="20" y2="44" stroke="url(#steel)" stroke-width="2.5"/>
    <line x1="32" y1="18" x2="44" y2="44" stroke="url(#steel)" stroke-width="2.5"/>
    <line x1="32" y1="18" x2="15" y2="44" stroke="url(#steel)" stroke-width="2"/>
    <!-- Entretoises horizontales -->
    <line x1="25" y1="28" x2="39" y2="28" stroke="url(#steel)" stroke-width="1.5"/>
    <line x1="22" y1="36" x2="42" y2="36" stroke="url(#steel)" stroke-width="1.5"/>
    <!-- Câble d'extraction vertical -->
    <line x1="32" y1="24" x2="32" y2="40" stroke="#f5d77f" stroke-width="1"/>
    <!-- Wagonnet de mine (berline) chargé de charbon & fer au sol -->
    <polygon points="26,38 38,38 41,45 23,45" fill="url(#coal)" stroke="url(#steel)" stroke-width="1"/>
    <!-- Minerai débordant du wagonnet -->
    <polygon points="27,38 32,35 37,38" fill="url(#gold)"/>
    <!-- Roues du wagonnet -->
    <circle cx="26" cy="46" r="2.5" fill="url(#steel)" stroke="#14171c" stroke-width="0.8"/>
    <circle cx="38" cy="46" r="2.5" fill="url(#steel)" stroke="#14171c" stroke-width="0.8"/>
    <!-- Rails de mine -->
    <line x1="12" y1="48" x2="52" y2="48" stroke="#525d6e" stroke-width="2"/>
  </g>
</svg>