<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c98a53"/>
      <stop offset="100%" stop-color="#7a4b22"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Roue de transport à rayons en arrière-plan -->
    <circle cx="42" cy="28" r="12" fill="#20252e" stroke="url(#steel)" stroke-width="2"/>
    <circle cx="42" cy="28" r="3" fill="url(#gold)"/>
    <line x1="42" y1="16" x2="42" y2="40" stroke="url(#steel)" stroke-width="1.2"/>
    <line x1="30" y1="28" x2="54" y2="28" stroke="url(#steel)" stroke-width="1.2"/>
    <line x1="33" y1="19" x2="51" y2="37" stroke="url(#steel)" stroke-width="1.2"/>
    <line x1="33" y1="37" x2="51" y2="19" stroke="url(#steel)" stroke-width="1.2"/>
    <!-- Caisse de transport en bois cerclée de fer au premier plan -->
    <rect x="14" y="24" width="26" height="24" rx="1.5" fill="url(#wood)" stroke="#523214" stroke-width="1"/>
    <!-- Cornières et ferrures métalliques -->
    <rect x="14" y="24" width="26" height="4" fill="url(#steel)"/>
    <rect x="14" y="44" width="26" height="4" fill="url(#steel)"/>
    <line x1="27" y1="24" x2="27" y2="48" stroke="url(#steel)" stroke-width="2"/>
    <line x1="14" y1="28" x2="40" y2="44" stroke="#4a2d12" stroke-width="1.2"/>
    <line x1="14" y1="44" x2="40" y2="28" stroke="#4a2d12" stroke-width="1.2"/>
    <!-- Rails de transport en bas -->
    <line x1="10" y1="50" x2="54" y2="50" stroke="#7a8290" stroke-width="2"/>
    <line x1="16" y1="48" x2="16" y2="52" stroke="#525d6e" stroke-width="2"/>
    <line x1="28" y1="48" x2="28" y2="52" stroke="#525d6e" stroke-width="2"/>
    <line x1="40" y1="48" x2="40" y2="52" stroke="#525d6e" stroke-width="2"/>
    <line x1="50" y1="48" x2="50" y2="52" stroke="#525d6e" stroke-width="2"/>
  </g>
</svg>