<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9beaa"/>
    </linearGradient>
    <linearGradient id="purpleCivic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a6ce0"/>
      <stop offset="100%" stop-color="#562999"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Dôme central majestueux de la Préfecture -->
    <path d="M 26 21 C 26 14, 38 14, 38 21 Z" fill="url(#purpleCivic)" stroke="url(#gold)" stroke-width="1"/>
    <line x1="32" y1="10" x2="32" y2="15" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="32" cy="10" r="1.5" fill="url(#gold)"/>
    <!-- Toiture à balustrade des deux ailes -->
    <rect x="13" y="21" width="38" height="3" fill="url(#gold)"/>
    <!-- Pavillons latéraux et corps central de l'hôtel de préfecture -->
    <rect x="14" y="24" width="36" height="23" fill="url(#stone)" stroke="#7a6e5b" stroke-width="1"/>
    <!-- Pavillon central en légère saillie -->
    <rect x="25" y="21" width="14" height="26" fill="url(#stone)" stroke="url(#gold)" stroke-width="0.8"/>
    <!-- Colonnes néoclassiques du corps central -->
    <line x1="27" y1="26" x2="27" y2="40" stroke="#7a6e5b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="26" x2="37" y2="40" stroke="#7a6e5b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Fenêtres régulières d'apparat -->
    <rect x="17" y="27" width="4" height="5" fill="#20252e"/>
    <rect x="43" y="27" width="4" height="5" fill="#20252e"/>
    <rect x="17" y="35" width="4" height="5" fill="#20252e"/>
    <rect x="43" y="35" width="4" height="5" fill="#20252e"/>
    <rect x="30" y="26" width="4" height="6" fill="url(#purpleCivic)"/>
    <!-- Entrée d'honneur et perron -->
    <path d="M 29 47 L 29 39 C 29 37.5, 35 37.5, 35 39 L 35 47 Z" fill="#20252e" stroke="url(#gold)" stroke-width="0.8"/>
    <!-- Grille monumentale en fer forgé -->
    <line x1="10" y1="48" x2="54" y2="48" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="12" y1="46" x2="12" y2="50" stroke="url(#gold)" stroke-width="1"/>
    <line x1="22" y1="46" x2="22" y2="50" stroke="url(#gold)" stroke-width="1"/>
    <line x1="42" y1="46" x2="42" y2="50" stroke="url(#gold)" stroke-width="1"/>
    <line x1="52" y1="46" x2="52" y2="50" stroke="url(#gold)" stroke-width="1"/>
  </g>
</svg>