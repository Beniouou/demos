<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26c71"/>
      <stop offset="100%" stop-color="#a82329"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Lyre d'Apollon ornée -->
    <!-- Bras courbes de la lyre -->
    <path d="M 21 16 C 18 26, 19 38, 25 43 C 28 45, 36 45, 39 43 C 45 38, 46 26, 43 16" 
          fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Traverse supérieure de la lyre -->
    <rect x="20" y="16" width="24" height="3" rx="1" fill="url(#gold)"/>
    <!-- Cordes de la lyre -->
    <line x1="26" y1="19" x2="26" y2="42" stroke="url(#steel)" stroke-width="0.9"/>
    <line x1="30" y1="19" x2="30" y2="43" stroke="url(#steel)" stroke-width="0.9"/>
    <line x1="34" y1="19" x2="34" y2="43" stroke="url(#steel)" stroke-width="0.9"/>
    <line x1="38" y1="19" x2="38" y2="42" stroke="url(#steel)" stroke-width="0.9"/>
    <!-- Base de caisse de résonance -->
    <path d="M 24 40 C 27 46, 37 46, 40 40 Z" fill="url(#gold)" stroke="#8f6418" stroke-width="1"/>
    <circle cx="32" cy="42" r="1.5" fill="#14171c"/>
    <!-- Masque comique en bas à gauche -->
    <circle cx="17" cy="42" r="5" fill="#f5d77f" stroke="#8f6418" stroke-width="0.8"/>
    <circle cx="15.5" cy="40.5" r="0.8" fill="#14171c"/>
    <circle cx="18.5" cy="40.5" r="0.8" fill="#14171c"/>
    <path d="M 15 44 Q 17 46 19 44" fill="none" stroke="#14171c" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Masque tragique en bas à droite -->
    <circle cx="47" cy="42" r="5" fill="#c4c9d2" stroke="#525d6e" stroke-width="0.8"/>
    <circle cx="45.5" cy="40.5" r="0.8" fill="#14171c"/>
    <circle cx="48.5" cy="40.5" r="0.8" fill="#14171c"/>
    <path d="M 45 45 Q 47 43 49 45" fill="none" stroke="#14171c" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>