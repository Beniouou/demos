<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#bdae97"/>
    </linearGradient>
    <linearGradient id="chalkboard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#284a36"/>
      <stop offset="100%" stop-color="#142b1e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Campanile républicain avec cloche d'école au sommet -->
    <polygon points="32,8 35,14 29,14" fill="url(#gold)"/>
    <rect x="29" y="14" width="6" height="8" fill="none" stroke="url(#gold)" stroke-width="1"/>
    <!-- Cloche dorée -->
    <path d="M 30.5 16 C 30.5 15, 33.5 15, 33.5 16 L 34.5 20 L 29.5 20 Z" fill="url(#gold)"/>
    <!-- Toiture de l'école communale -->
    <polygon points="16,24 32,18 48,24" fill="#a8432a" stroke="#5c190a" stroke-width="1"/>
    <!-- Bâtiment de l'école -->
    <rect x="18" y="24" width="28" height="23" fill="url(#stone)" stroke="#7a6e5b" stroke-width="1"/>
    <!-- Tableau noir d'école au premier plan -->
    <rect x="22" y="32" width="20" height="14" rx="1" fill="url(#chalkboard)" stroke="url(#gold)" stroke-width="1.2"/>
    <!-- Écritures à la craie blanche : A B C & 1 2 3 -->
    <text x="25" y="38" fill="#ffffff" font-size="5" font-family="serif" font-weight="bold">ABC</text>
    <text x="25" y="44" fill="#f5d77f" font-size="5" font-family="serif" font-weight="bold">123</text>
    <!-- Livre ouvert à la base du tableau -->
    <path d="M 34 43 Q 37 42 40 43 L 40 40 Q 37 39 34 40 Z" fill="#ffffff"/>
    <path d="M 34 43 Q 31 42 28 43 L 28 40 Q 31 39 34 40 Z" fill="#ffffff"/>
    <!-- Marches de l'école -->
    <rect x="14" y="47" width="36" height="2" fill="url(#gold)"/>
    <rect x="12" y="49" width="40" height="2" fill="#7a6e5b"/>
  </g>
</svg>