<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d5ccba"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26c71"/>
      <stop offset="100%" stop-color="#a82329"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Tente de pionnier / explorateur (Camp de base fondateur) -->
    <!-- Mât central et fanion au sommet -->
    <line x1="32" y1="12" x2="32" y2="48" stroke="#8f6418" stroke-width="2"/>
    <polygon points="32,12 42,16 32,20" fill="url(#ruby)"/>
    <!-- Toile principale de tente conique / canadienne -->
    <polygon points="32,18 51,46 13,46" fill="url(#canvas)" stroke="#8f8574" stroke-width="1.2"/>
    <!-- Pan d'ouverture de la tente entrouvert -->
    <polygon points="32,22 38,46 26,46" fill="#20252e"/>
    <polygon points="32,22 26,46 32,46" fill="#14171c"/>
    <!-- Haubans / cordes de tension vers les piquets -->
    <line x1="32" y1="20" x2="10" y2="48" stroke="#8f6418" stroke-width="1"/>
    <line x1="32" y1="20" x2="54" y2="48" stroke="#8f6418" stroke-width="1"/>
    <!-- Feu de camp de pionniers devant -->
    <polygon points="38,45 42,42 40,49" fill="url(#gold)"/>
    <polygon points="41,47 45,44 43,50" fill="#f09b68"/>
    <!-- Sol de terre battue -->
    <line x1="8" y1="50" x2="56" y2="50" stroke="#7a8290" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>