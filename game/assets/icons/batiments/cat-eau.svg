<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70c6ff"/>
      <stop offset="50%" stop-color="#3399ff"/>
      <stop offset="100%" stop-color="#1460b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Grande goutte d'eau centrale pure -->
    <path d="M 32 13 C 32 13, 44 26, 44 34 C 44 41, 38.5 46, 32 46 C 25.5 46, 20 41, 20 34 C 20 26, 32 13, 32 13 Z" 
          fill="url(#water)" stroke="#70c6ff" stroke-width="1.8"/>
    <!-- Reflet spéculaire lumineux de la goutte -->
    <path d="M 27 25 C 24 30, 24 36, 27 40" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <circle cx="37" cy="38" r="2" fill="#ffffff" opacity="0.6"/>
    <!-- Ondelettes concentriques de surface à la base -->
    <ellipse cx="32" cy="46" rx="16" ry="4" fill="none" stroke="url(#water)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <ellipse cx="32" cy="49" rx="12" ry="3" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.7"/>
    <!-- Étoile d'eau vive -->
    <polygon points="32,9 33.5,12 36,12 34,14 35,17 32,15 29,17 30,14 28,12 30.5,12" fill="url(#gold)"/>
  </g>
</svg>