<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Coffre au trésor entrouvert -->
    <rect x="15" y="27" width="34" height="23" rx="2" fill="#20252e" stroke="url(#gold)" stroke-width="2"/>
    <line x1="23" y1="27" x2="23" y2="50" stroke="#7a8290" stroke-width="2.5"/>
    <line x1="41" y1="27" x2="41" y2="50" stroke="#7a8290" stroke-width="2.5"/>
    <circle cx="23" cy="38" r="1.2" fill="url(#gold)"/>
    <circle cx="41" cy="38" r="1.2" fill="url(#gold)"/>
    <!-- Serrure -->
    <rect x="30" y="32" width="4" height="6" rx="1" fill="url(#gold)"/>
    <circle cx="32" cy="34" r="1" fill="#14171c"/>
    <!-- Couvercle ouvert -->
    <path d="M 13 25 C 13 15, 51 15, 51 25 Z" fill="#262d38" stroke="url(#gold)" stroke-width="1.8"/>
    <!-- Lingots d'or -->
    <polygon points="22,25 32,25 30,21 24,21" fill="url(#gold)" stroke="#8f6418" stroke-width="0.8"/>
    <polygon points="31,25 41,25 39,21 33,21" fill="url(#gold)" stroke="#8f6418" stroke-width="0.8"/>
    <polygon points="27,21 37,21 35,17 29,17" fill="#f5d77f" stroke="#8f6418" stroke-width="0.8"/>
    <!-- Pièces d'or empilées au sol -->
    <ellipse cx="20" cy="49" rx="4" ry="2" fill="url(#gold)" stroke="#8f6418" stroke-width="0.7"/>
    <ellipse cx="20" cy="47" rx="4" ry="2" fill="#f5d77f" stroke="#8f6418" stroke-width="0.7"/>
    <ellipse cx="44" cy="49" rx="4" ry="2" fill="url(#gold)" stroke="#8f6418" stroke-width="0.7"/>
    <ellipse cx="44" cy="47" rx="4" ry="2" fill="#f5d77f" stroke="#8f6418" stroke-width="0.7"/>
  </g>
</svg>