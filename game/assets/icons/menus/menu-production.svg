<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09b68"/>
      <stop offset="100%" stop-color="#b8582b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Roue d'engrenage industrielle -->
    <g transform="translate(32,32)">
      <circle cx="0" cy="0" r="16" fill="#20252e" stroke="url(#steel)" stroke-width="2"/>
      <!-- Dents de l'engrenage -->
      <rect x="-3" y="-19" width="6" height="4" rx="1" fill="url(#steel)"/>
      <rect x="-3" y="15" width="6" height="4" rx="1" fill="url(#steel)"/>
      <rect x="-19" y="-3" width="4" height="6" rx="1" fill="url(#steel)"/>
      <rect x="15" y="-3" width="4" height="6" rx="1" fill="url(#steel)"/>
      <rect x="-14" y="-14" width="5" height="5" rx="1" transform="rotate(45)" fill="url(#steel)"/>
      <rect x="-14" y="-14" width="5" height="5" rx="1" transform="rotate(135)" fill="url(#steel)"/>
      <rect x="-14" y="-14" width="5" height="5" rx="1" transform="rotate(225)" fill="url(#steel)"/>
      <rect x="-14" y="-14" width="5" height="5" rx="1" transform="rotate(315)" fill="url(#steel)"/>
      <circle cx="0" cy="0" r="7" fill="#14171c" stroke="#566275" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="url(#gold)"/>
    </g>
    <!-- Marteau croisé de forgeron -->
    <g transform="rotate(-30 32 32)">
      <rect x="30" y="12" width="4" height="40" rx="1.5" fill="url(#copper)" stroke="#8f6418" stroke-width="0.8"/>
      <path d="M 23 15 L 41 15 L 43 23 L 21 23 Z" fill="url(#gold)" stroke="#8f6418" stroke-width="1"/>
      <rect x="26" y="14" width="12" height="10" fill="url(#steel)"/>
    </g>
    <!-- Étincelles de forge -->
    <circle cx="48" cy="18" r="1.5" fill="#f5d77f"/>
    <circle cx="45" cy="14" r="1" fill="#f09b68"/>
    <circle cx="51" cy="22" r="1" fill="#f5d77f"/>
  </g>
</svg>