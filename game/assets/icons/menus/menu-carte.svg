<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Anneau de boussole gradué -->
    <circle cx="32" cy="32" r="18" fill="none" stroke="#485363" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="14" fill="none" stroke="#363d4a" stroke-width="0.8"/>
    <!-- Pointes mineures -->
    <polygon points="32,32 43,21 35,29" fill="#7a8290"/>
    <polygon points="32,32 43,21 29,27" fill="#525b6a"/>
    <polygon points="32,32 43,43 35,35" fill="#7a8290"/>
    <polygon points="32,32 43,43 27,35" fill="#525b6a"/>
    <polygon points="32,32 21,43 29,35" fill="#7a8290"/>
    <polygon points="32,32 21,43 27,29" fill="#525b6a"/>
    <polygon points="32,32 21,21 29,27" fill="#7a8290"/>
    <polygon points="32,32 21,21 35,27" fill="#525b6a"/>
    <!-- Pointes majeures -->
    <polygon points="32,10 35,28 32,26" fill="url(#gold)"/>
    <polygon points="32,10 29,28 32,26" fill="#8f6418"/>
    <polygon points="32,54 35,36 32,38" fill="url(#steel)"/>
    <polygon points="32,54 29,36 32,38" fill="#525b6a"/>
    <polygon points="54,32 36,35 38,32" fill="url(#steel)"/>
    <polygon points="54,32 36,29 38,32" fill="#525b6a"/>
    <polygon points="10,32 28,35 26,32" fill="url(#steel)"/>
    <polygon points="10,32 28,29 26,32" fill="#525b6a"/>
    <!-- Centre boussole -->
    <circle cx="32" cy="32" r="3.5" fill="#14171c" stroke="#d9a441" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="1.5" fill="#f5d77f"/>
  </g>
</svg>