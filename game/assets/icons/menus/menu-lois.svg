<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26c71"/>
      <stop offset="100%" stop-color="#a82329"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Parchemin de fond -->
    <path d="M 19 14 C 23 12, 41 12, 45 14 C 47 26, 47 40, 45 50 C 41 48, 23 48, 19 50 Z" fill="#20252e" stroke="#485363" stroke-width="1"/>
    <line x1="24" y1="20" x2="40" y2="20" stroke="#5a6577" stroke-width="1" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="38" y2="24" stroke="#5a6577" stroke-width="1" stroke-linecap="round"/>
    <line x1="24" y1="28" x2="36" y2="28" stroke="#5a6577" stroke-width="1" stroke-linecap="round"/>
    <!-- Balance de la Justice -->
    <line x1="32" y1="15" x2="32" y2="44" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="32,12 35,16 29,16" fill="url(#gold)"/>
    <circle cx="32" cy="18" r="2" fill="url(#gold)"/>
    <!-- Fléau horizontal -->
    <path d="M 16 21 C 24 20, 40 20, 48 21" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Plateau gauche -->
    <line x1="17" y1="22" x2="13" y2="34" stroke="#d9a441" stroke-width="1"/>
    <line x1="17" y1="22" x2="21" y2="34" stroke="#d9a441" stroke-width="1"/>
    <path d="M 12 34 Q 17 38 22 34 Z" fill="url(#gold)" stroke="#8f6418" stroke-width="0.8"/>
    <!-- Plateau droit -->
    <line x1="47" y1="22" x2="43" y2="34" stroke="#d9a441" stroke-width="1"/>
    <line x1="47" y1="22" x2="51" y2="34" stroke="#d9a441" stroke-width="1"/>
    <path d="M 42 34 Q 47 38 52 34 Z" fill="url(#gold)" stroke="#8f6418" stroke-width="0.8"/>
    <!-- Socle & Sceau de cire officiel -->
    <path d="M 27 44 L 37 44 L 39 47 L 25 47 Z" fill="url(#gold)"/>
    <circle cx="32" cy="48" r="4.5" fill="url(#ruby)" stroke="#f26c71" stroke-width="0.8"/>
    <circle cx="32" cy="48" r="2.5" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
  </g>
</svg>