<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26c71"/>
      <stop offset="100%" stop-color="#a82329"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Couverture extérieure du livre -->
    <path d="M 12 45 C 20 44, 30 46, 32 49 C 34 46, 44 44, 52 45 L 53 19 C 45 18, 34 20, 32 23 C 30 20, 19 18, 11 19 Z" 
          fill="#1b2029" stroke="url(#gold)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Page de gauche -->
    <path d="M 13 43 C 20 42, 29 44, 31 46 L 31 22 C 29 20, 20 18, 13 19 Z" fill="#2d3542"/>
    <!-- Page de droite -->
    <path d="M 51 43 C 44 42, 35 44, 33 46 L 33 22 C 35 20, 44 18, 51 19 Z" fill="#262d38"/>
    <!-- Reliure centrale -->
    <line x1="32" y1="22" x2="32" y2="48" stroke="url(#gold)" stroke-width="2"/>
    <!-- Signet ruban rouge pendant -->
    <path d="M 32 48 L 32 54 L 34 52 L 36 54 L 36 47 Z" fill="url(#ruby)"/>
    <!-- Point d'interrogation / savoir gravé en or -->
    <path d="M 39 27 C 39 24, 45 24, 45 28 C 45 31, 42 32, 42 35" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="42" cy="39" r="1.2" fill="url(#gold)"/>
    <!-- Lignes de texte manuscrit -->
    <line x1="17" y1="25" x2="27" y2="25" stroke="#566275" stroke-width="1" stroke-linecap="round"/>
    <line x1="17" y1="29" x2="27" y2="29" stroke="#566275" stroke-width="1" stroke-linecap="round"/>
    <line x1="17" y1="33" x2="25" y2="33" stroke="#566275" stroke-width="1" stroke-linecap="round"/>
    <line x1="17" y1="37" x2="26" y2="37" stroke="#566275" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>