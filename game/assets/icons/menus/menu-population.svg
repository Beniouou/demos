<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09b68"/>
      <stop offset="100%" stop-color="#b8582b"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26c71"/>
      <stop offset="100%" stop-color="#a82329"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Couronne de laurier en arrière-plan -->
    <path d="M 14 38 C 12 26, 17 17, 26 15" fill="none" stroke="#525d6e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 50 38 C 52 26, 47 17, 38 15" fill="none" stroke="#525d6e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Silhouette gauche : Ouvrier avec casquette -->
    <circle cx="21" cy="27" r="4.5" fill="url(#copper)"/>
    <path d="M 16 26 C 17 23, 25 23, 27 25 L 27 27 L 15 27 Z" fill="#b8582b"/>
    <path d="M 12 47 C 12 37, 17 35, 22 35 C 25 35, 27 37, 28 39 C 24 42, 20 46, 20 51 Z" fill="#3a4250" stroke="#566275" stroke-width="0.8"/>
    <!-- Silhouette droite : Cadre avec haut de forme -->
    <circle cx="43" cy="27" r="4.5" fill="url(#copper)"/>
    <path d="M 38 24 L 48 24 L 46 17 L 40 17 Z" fill="#20252e" stroke="url(#gold)" stroke-width="0.8"/>
    <path d="M 36 47 C 36 41, 40 35, 44 34 C 49 34, 52 37, 52 47 Z" fill="#20252e" stroke="url(#gold)" stroke-width="0.8"/>
    <!-- Silhouette centrale : Profession intermédiaire (premier plan) -->
    <circle cx="32" cy="23" r="5.5" fill="url(#gold)"/>
    <path d="M 21 48 C 21 38, 26 33, 32 33 C 38 33, 43 38, 43 48 Z" fill="url(#steel)" stroke="#363d4a" stroke-width="1"/>
    <polygon points="32,36 30,42 32,45 34,42" fill="url(#ruby)"/>
  </g>
</svg>