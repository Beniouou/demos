<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Fronton du sommet (L'État) -->
    <polygon points="32,11 46,18 18,18" fill="url(#gold)" stroke="#8f6418" stroke-width="0.8"/>
    <rect x="20" y="18" width="24" height="2" fill="url(#gold)"/>
    <line x1="22" y1="20" x2="22" y2="27" stroke="url(#steel)" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="20" x2="28" y2="27" stroke="url(#steel)" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="20" x2="36" y2="27" stroke="url(#steel)" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="20" x2="42" y2="27" stroke="url(#steel)" stroke-width="2" stroke-linecap="round"/>
    <rect x="18" y="27" width="28" height="3" fill="url(#gold)" rx="0.5"/>
    <!-- Liaison arborescente descendante -->
    <line x1="32" y1="30" x2="32" y2="37" stroke="#d9a441" stroke-width="1.8"/>
    <!-- Nœud intermédiaire (Préfecture) -->
    <circle cx="32" cy="37" r="3.2" fill="#20252e" stroke="#d9a441" stroke-width="1.5"/>
    <circle cx="32" cy="37" r="1.2" fill="#d9a441"/>
    <!-- Embranchements vers les communes de base -->
    <path d="M 32 40 L 32 44 M 32 44 L 18 44 L 18 48 M 32 44 L 46 44 L 46 48 M 32 44 L 32 48" fill="none" stroke="#7a8290" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 3 Nœuds terminaux (Communes) -->
    <circle cx="18" cy="50" r="3" fill="url(#steel)" stroke="#363d4a" stroke-width="1"/>
    <circle cx="32" cy="50" r="3" fill="url(#steel)" stroke="#363d4a" stroke-width="1"/>
    <circle cx="46" cy="50" r="3" fill="url(#steel)" stroke="#363d4a" stroke-width="1"/>
  </g>
</svg>