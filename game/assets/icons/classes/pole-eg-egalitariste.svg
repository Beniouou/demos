<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="egRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b72"/>
      <stop offset="50%" stop-color="#e5484d"/>
      <stop offset="100%" stop-color="#a31d22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c6922e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#e5484d" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#e5484d" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.6"/>
  <g filter="url(#shadow)">
    <!-- Cocarde / Anneau d'égalité -->
    <circle cx="32" cy="32" r="19" fill="none" stroke="url(#egRed)" stroke-width="2.5" opacity="0.4"/>
    <!-- Balance d'égalité parfaite -->
    <!-- Pilier central -->
    <line x1="32" y1="16" x2="32" y2="44" stroke="url(#egRed)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="32,12 36,17 28,17" fill="url(#egRed)"/>
    <!-- Fléau parfaitement droit (horizontal) -->
    <line x1="15" y1="23" x2="49" y2="23" stroke="url(#egRed)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Chaînes et plateaux au même niveau -->
    <line x1="18" y1="23" x2="14" y2="34" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <line x1="18" y1="23" x2="22" y2="34" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <path d="M 13 34 Q 18 38 23 34 Z" fill="url(#egRed)" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="46" y1="23" x2="42" y2="34" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <line x1="46" y1="23" x2="50" y2="34" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <path d="M 41 34 Q 46 38 51 34 Z" fill="url(#egRed)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Mains unies / poignée de fraternité à la base -->
    <rect x="25" y="44" width="14" height="4" rx="2" fill="url(#gold)"/>
    <text x="32" y="52" fill="#ff6b72" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="1">ÉGALITÉ</text>
  </g>
</svg>