<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="poOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa654"/>
      <stop offset="50%" stop-color="#f76808"/>
      <stop offset="100%" stop-color="#b33a00"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c6922e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#f76808" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#f76808" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.6"/>
  <g filter="url(#shadow)">
    <!-- Rayons du soleil de la science et du progrès -->
    <g stroke="url(#poOrange)" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
      <line x1="32" y1="10" x2="32" y2="16"/>
      <line x1="32" y1="48" x2="32" y2="54"/>
      <line x1="10" y1="32" x2="16" y2="32"/>
      <line x1="48" y1="32" x2="54" y2="32"/>
      <line x1="16" y1="16" x2="21" y2="21"/>
      <line x1="48" y1="48" x2="43" y2="43"/>
      <line x1="48" y1="16" x2="43" y2="21"/>
      <line x1="16" y1="48" x2="21" y2="43"/>
    </g>
    <!-- Dynamo / Engrenage d'énergie -->
    <circle cx="32" cy="32" r="14" fill="#20252e" stroke="url(#poOrange)" stroke-width="2"/>
    <circle cx="32" cy="32" r="8" fill="#14171c" stroke="url(#gold)" stroke-width="1.5"/>
    <!-- Éclair fulgurant traversant le centre -->
    <polygon points="34,18 25,32 32,32 28,46 39,30 32,30" fill="url(#gold)" stroke="#8f6418" stroke-width="0.8"/>
    <!-- Texte Positivisme -->
    <text x="32" y="53" fill="#ffa654" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="1">PROGRÈS</text>
  </g>
</svg>