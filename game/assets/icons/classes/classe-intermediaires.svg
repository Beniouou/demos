<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73a9ff"/>
      <stop offset="100%" stop-color="#2d64c8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Registre technique / carnet d'encadrement en arrière-plan -->
    <rect x="22" y="16" width="28" height="34" rx="2" fill="#20252e" stroke="url(#blue)" stroke-width="1.2"/>
    <line x1="28" y1="22" x2="44" y2="22" stroke="#566275" stroke-width="1" stroke-linecap="round"/>
    <line x1="28" y1="26" x2="44" y2="26" stroke="#566275" stroke-width="1" stroke-linecap="round"/>
    <line x1="28" y1="30" x2="40" y2="30" stroke="#566275" stroke-width="1" stroke-linecap="round"/>
    <!-- Équerre à dessin de précision (angle 90°) -->
    <polygon points="14,48 14,18 20,18 20,42 44,42 44,48" fill="url(#gold)" stroke="#8f6418" stroke-width="0.8"/>
    <polygon points="20,28 20,42 34,42" fill="#14171c" opacity="0.6"/>
    <!-- Graduations de l'équerre -->
    <line x1="14" y1="23" x2="17" y2="23" stroke="#8f6418" stroke-width="0.8"/>
    <line x1="14" y1="28" x2="18" y2="28" stroke="#8f6418" stroke-width="0.8"/>
    <line x1="14" y1="33" x2="17" y2="33" stroke="#8f6418" stroke-width="0.8"/>
    <line x1="14" y1="38" x2="18" y2="38" stroke="#8f6418" stroke-width="0.8"/>
    <line x1="25" y1="48" x2="25" y2="45" stroke="#8f6418" stroke-width="0.8"/>
    <line x1="30" y1="48" x2="30" y2="44" stroke="#8f6418" stroke-width="0.8"/>
    <line x1="35" y1="48" x2="35" y2="45" stroke="#8f6418" stroke-width="0.8"/>
    <line x1="40" y1="48" x2="40" y2="44" stroke="#8f6418" stroke-width="0.8"/>
    <!-- Compas technique de précision au centre -->
    <circle cx="34" cy="18" r="3" fill="url(#steel)" stroke="#363d4a" stroke-width="1"/>
    <line x1="34" y1="18" x2="26" y2="44" stroke="url(#steel)" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="18" x2="42" y2="44" stroke="url(#steel)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="34" cy="18" r="1.2" fill="url(#gold)"/>
    <path d="M 28 32 Q 34 35 40 32" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
  </g>
</svg>