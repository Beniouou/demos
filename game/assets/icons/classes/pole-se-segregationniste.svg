<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="seBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb0ff"/>
      <stop offset="50%" stop-color="#4c8df6"/>
      <stop offset="100%" stop-color="#2056b3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c6922e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#4c8df6" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#4c8df6" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.6"/>
  <g filter="url(#shadow)">
    <!-- Pyramide hiérarchique étagée en 3 rangs stricts -->
    <!-- Sommet (Niveau 3 - Cadres / Dirigeants) avec couronne -->
    <polygon points="32,13 38,22 26,22" fill="url(#gold)" stroke="#363d4a" stroke-width="1"/>
    <!-- Couronne dorée au sommet -->
    <polygon points="29,15 31,18 32,15 33,18 35,15 34,20 30,20" fill="#ffffff" opacity="0.9"/>
    <!-- Ligne de séparation franche -->
    <line x1="24" y1="23" x2="40" y2="23" stroke="#14171c" stroke-width="1.5"/>
    <!-- Palier médian (Niveau 2 - Professions intermédiaires) -->
    <polygon points="25,24 39,24 45,34 19,34" fill="url(#seBlue)" stroke="#363d4a" stroke-width="1"/>
    <!-- Ligne de séparation franche -->
    <line x1="17" y1="35" x2="47" y2="35" stroke="#14171c" stroke-width="1.5"/>
    <!-- Base large (Niveau 1 - Ouvriers) -->
    <polygon points="18,36 46,36 52,47 12,47" fill="#2d3f5e" stroke="#4c8df6" stroke-width="1"/>
    <!-- Inscription d'ordre -->
    <text x="32" y="53" fill="#7eb0ff" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="1">HIÉRARCHIE</text>
  </g>
</svg>