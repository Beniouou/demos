<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26c71"/>
      <stop offset="100%" stop-color="#a82329"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2d9cc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Décret officiel / parchemin déroulé avec ruban -->
    <path d="M 18 18 C 22 15, 38 15, 42 18 C 45 30, 45 42, 42 48 C 38 45, 22 45, 18 48 Z" 
          fill="url(#cream)" stroke="#a39682" stroke-width="1"/>
    <!-- Texte calligraphique officiel -->
    <line x1="22" y1="22" x2="38" y2="22" stroke="#5a4d3b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="22" y1="26" x2="36" y2="26" stroke="#5a4d3b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="22" y1="30" x2="34" y2="30" stroke="#5a4d3b" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Sceau de cire officiel avec rubans pendants -->
    <path d="M 28 44 L 26 53 L 30 50 L 34 53 L 32 44 Z" fill="url(#ruby)"/>
    <circle cx="30" cy="44" r="5" fill="url(#ruby)" stroke="#f26c71" stroke-width="1"/>
    <circle cx="30" cy="44" r="3" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>
    <!-- Encrier de bronze -->
    <rect x="42" y="38" width="10" height="9" rx="1.5" fill="#20252e" stroke="url(#gold)" stroke-width="1.2"/>
    <rect x="44" y="36" width="6" height="3" rx="1" fill="url(#gold)"/>
    <!-- Plume d'oie calligraphique oblique -->
    <g transform="rotate(-35 46 22)">
      <path d="M 46 8 C 50 16, 49 26, 46 36 L 45 36 C 43 26, 42 16, 46 8 Z" fill="url(#gold)" stroke="#8f6418" stroke-width="0.8"/>
      <!-- Pointe d'encre -->
      <polygon points="45,36 47,36 46,42" fill="#14171c"/>
      <line x1="46" y1="10" x2="46" y2="36" stroke="#8f6418" stroke-width="0.7"/>
    </g>
  </g>
</svg>