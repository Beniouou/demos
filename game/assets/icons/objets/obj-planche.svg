<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09b68"/>
      <stop offset="100%" stop-color="#b8582b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba8252"/>
      <stop offset="100%" stop-color="#694121"/>
    </linearGradient>
    <linearGradient id="bread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d488"/>
      <stop offset="50%" stop-color="#d99938"/>
      <stop offset="100%" stop-color="#8a5311"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26c71"/>
      <stop offset="100%" stop-color="#a82329"/>
    </linearGradient>
    <linearGradient id="brick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07253"/>
      <stop offset="100%" stop-color="#993821"/>
    </linearGradient>
    <linearGradient id="pottery" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e68055"/>
      <stop offset="100%" stop-color="#99421c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Empilement de trois planches de bois de menuiserie sciées -->
    <!-- Planche basse -->
    <polygon points="12,44 42,44 52,38 22,38" fill="url(#wood)" stroke="#3d210b" stroke-width="1"/>
    <polygon points="12,44 22,38 22,41 12,47" fill="#8a5322" stroke="#3d210b" stroke-width="0.8"/>
    <!-- Planche milieu -->
    <polygon points="14,37 44,37 54,31 24,31" fill="url(#wood)" stroke="#3d210b" stroke-width="1"/>
    <polygon points="14,37 24,31 24,34 14,40" fill="#8a5322" stroke="#3d210b" stroke-width="0.8"/>
    <!-- Planche haute -->
    <polygon points="16,30 46,30 56,24 26,24" fill="#e0b884" stroke="#3d210b" stroke-width="1"/>
    <polygon points="16,30 26,24 26,27 16,33" fill="#8a5322" stroke="#3d210b" stroke-width="0.8"/>
    <!-- Cernes et nervures du bois sur la planche haute -->
    <line x1="28" y1="27" x2="48" y2="27" stroke="#8a5322" stroke-width="0.8"/>
  </g>
</svg>