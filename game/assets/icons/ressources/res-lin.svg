<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b34"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a6731e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4c9d2"/>
      <stop offset="100%" stop-color="#7a8290"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09b68"/>
      <stop offset="100%" stop-color="#b8582b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba8252"/>
      <stop offset="100%" stop-color="#694121"/>
    </linearGradient>
    <linearGradient id="coal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d535e"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e2d5"/>
      <stop offset="100%" stop-color="#998e7d"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70c6ff"/>
      <stop offset="50%" stop-color="#3399ff"/>
      <stop offset="100%" stop-color="#1460b8"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26c71"/>
      <stop offset="100%" stop-color="#a82329"/>
    </linearGradient>
    <linearGradient id="wheat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="50%" stop-color="#e0a92b"/>
      <stop offset="100%" stop-color="#996a12"/>
    </linearGradient>
    <linearGradient id="clay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e5a"/>
      <stop offset="100%" stop-color="#993d1f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Tiges et fleurs de lin azurées -->
    <!-- Tiges vertes fines -->
    <path d="M 32 48 Q 30 38 24 28 M 32 48 Q 33 36 34 22 M 32 48 Q 36 38 42 26" fill="none" stroke="#30a46c" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Petite feuille -->
    <path d="M 30 36 Q 26 34 24 36" fill="none" stroke="#30a46c" stroke-width="1.5"/>
    <path d="M 34 32 Q 38 30 40 32" fill="none" stroke="#30a46c" stroke-width="1.5"/>
    <!-- Fleur de lin gauche (5 pétales bleus) -->
    <circle cx="23" cy="24" r="5" fill="#5288e0" stroke="#26529e" stroke-width="0.8"/>
    <circle cx="23" cy="24" r="1.5" fill="url(#wheat)"/>
    <!-- Fleur de lin centre (au sommet) -->
    <circle cx="34" cy="18" r="6" fill="#5288e0" stroke="#26529e" stroke-width="0.8"/>
    <circle cx="34" cy="18" r="1.8" fill="url(#wheat)"/>
    <!-- Fleur de lin droite -->
    <circle cx="43" cy="23" r="5" fill="#5288e0" stroke="#26529e" stroke-width="0.8"/>
    <circle cx="43" cy="23" r="1.5" fill="url(#wheat)"/>
    <!-- Capsule de graines de lin -->
    <ellipse cx="32" cy="45" rx="3" ry="2" fill="url(#gold)"/>
  </g>
</svg>