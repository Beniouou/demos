    <ellipse cx="40" cy="26" rx="6" ry="2.5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
    <!-- Étoile d'éclat au sommet -->
    <polygon points="40,16 41.5,19 44.5,20.5 41.5,22 40,25 38.5,22 35.5,20.5 38.5,19" fill="#ffffff"/>
