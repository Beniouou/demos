    <!-- Pile gauche -->
    <ellipse cx="22" cy="46" rx="9" ry="4" fill="url(#gold)" stroke="#8f6418" stroke-width="1"/>
    <ellipse cx="22" cy="42" rx="9" ry="4" fill="url(#gold)" stroke="#8f6418" stroke-width="1"/>
    <ellipse cx="22" cy="38" rx="9" ry="4" fill="url(#gold)" stroke="#8f6418" stroke-width="1"/>
    <ellipse cx="22" cy="34" rx="9" ry="4" fill="#f5d77f" stroke="#8f6418" stroke-width="1"/>
    <ellipse cx="22" cy="34" rx="6" ry="2.5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
    <!-- Pile droite plus haute -->
    <ellipse cx="40" cy="46" rx="9" ry="4" fill="url(#gold)" stroke="#8f6418" stroke-width="1"/>
    <ellipse cx="40" cy="42" rx="9" ry="4" fill="url(#gold)" stroke="#8f6418" stroke-width="1"/>
    <ellipse cx="40" cy="38" rx="9" ry="4" fill="url(#gold)" stroke="#8f6418" stroke-width="1"/>
