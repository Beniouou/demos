  <circle cx="32" cy="32" r="29" fill="url(#bg)" stroke="#363d4a" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d9a441" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.55"/>
  <g filter="url(#shadow)">
    <!-- Quartier de viande brute d'élevage avec os -->
    <path d="M 18 30 C 16 20, 28 16, 36 18 C 46 20, 50 28, 48 38 C 46 46, 34 48, 24 46 C 18 44, 16 38, 18 30 Z" 
          fill="url(#ruby)" stroke="#7a141a" stroke-width="1.5"/>
    <!-- Marbrures de gras blanc -->
    <path d="M 22 26 Q 30 32 38 28" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 26 36 Q 34 40 42 36" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <!-- Gros os de boucher dépassant -->
    <rect x="38" y="38" width="6" height="10" rx="2" fill="#ffffff" stroke="#c4c9d2" stroke-width="0.8" transform="rotate(-30 41 43)"/>
    <circle cx="45" cy="46" r="2.5" fill="#ffffff"/>
    <circle cx="48" cy="42" r="2.5" fill="#ffffff"/>
